<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — JointU</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-off-white">
<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="logo" style="display:block;text-align:center;margin-bottom:24px">Joint<span>U</span></a>
    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <div class="input-icon">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg>
        <input type="email" placeholder="name@example.com">
      </div>
    </div>
    <a href="login.html" class="btn btn-primary btn-full btn-lg" class="mb-14">Send Reset Link</a>
    <div class="modal-footer"><a href="login.html" class="modal-link">← Back to Login</a></div>
  </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
